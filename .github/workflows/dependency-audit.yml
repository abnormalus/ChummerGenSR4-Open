name: Dependency health
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Chummer.Mac.sln --locked-mode -p:UsedAvaloniaProducts=
      - run: python scripts/audit-dependencies.py artifacts/dependency-audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit
