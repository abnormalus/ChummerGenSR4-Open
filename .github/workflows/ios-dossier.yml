name: iOS dossier

on:
  pull_request:
    paths: ['Chummer.iOS/**', '.github/workflows/ios-dossier.yml', 'Chummer.Mac/assets/saves/**']
  push:
    branches: [master]
    paths: ['Chummer.iOS/**', '.github/workflows/ios-dossier.yml', 'Chummer.Mac/assets/saves/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-and-simulator:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Chummer.iOS
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests and real character fixtures
        env:
          CHUMMER_FIXTURE_ROOT: ${{ github.workspace }}/Chummer.Mac/assets/saves
        run: swift test
      - name: Build iPhone and iPad app for simulator
        run: >-
          xcodebuild -project ChummerDossier.xcodeproj -scheme ChummerDossier
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../artifacts/ios-derived CODE_SIGNING_ALLOWED=NO build
