name: Consolidate downloads in Archived
on:
  workflow_dispatch:
    inputs:
      retire_source_releases:
        description: Remove the old archive release entries after verifying every replacement
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: chummer-release-assets
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Verify archival safeguards
        run: python3 scripts/tests/test_archive_nightly.py
      - name: Consolidate verified archive downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RETIRE_SOURCES: ${{ inputs.retire_source_releases }}
        run: |
          args=(--consolidate)
          if [[ "$RETIRE_SOURCES" == "true" ]]; then
            args+=(--retire-source-releases)
          fi
          python3 scripts/archive-nightly.py "${args[@]}"
