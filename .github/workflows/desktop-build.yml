name: Nightly desktop builds
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify release archival safeguards
        run: python scripts/tests/test_archive_nightly.py
      - name: Verify reviewed PDF.js bundle
        run: python scripts/check-pdfjs.py
      - name: Test PDF.js safeguards
        run: python scripts/tests/test_pdfjs.py
      - name: Check modernization safeguards
        run: python scripts/check-modernization.py
      - name: Test modernization safeguards
        run: python scripts/tests/test_modernization.py
      - name: Restore reviewed dependency graph
        run: dotnet restore Chummer.Mac.sln --locked-mode -p:UsedAvaloniaProducts=
      - name: Build shared desktop application
        run: dotnet build Chummer.Mac.sln -c Release --no-restore --disable-build-servers -p:UsedAvaloniaProducts=
      - name: Check characters and UI behavior
        run: dotnet Chummer.Mac/bin/Release/net10.0/ChummerMac.dll --smoke-test artifacts/checks Chummer.Mac/assets/saves
      - name: Verify native bulk-operation cancellation and shutdown
        shell: pwsh
        run: |
          $character = (Resolve-Path 'artifacts/checks/creation.chum').Path
          $report = Join-Path $PWD 'artifacts/checks/native-bulk.json'
          $appName = if ($IsWindows) { 'ChummerMac.exe' } else { 'ChummerMac' }
          $exe = (Resolve-Path "Chummer.Mac/bin/Release/net10.0/$appName").Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--check-bulk', "`"$character`"", "`"$report`"") -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            throw 'Native bulk-operation checks timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Native bulk-operation checks failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Native bulk-operation report is missing.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.checks.Count -lt 178) { throw 'Native bulk-operation checks did not complete.' }
      - name: Ensure native Windows browser runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1
      - name: Verify native Windows character preview and PDF output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $character = (Resolve-Path 'artifacts/checks/career.chum').Path
          $pdf = Join-Path $PWD 'artifacts/checks/native-character.pdf'
          $exe = (Resolve-Path 'Chummer.Mac/bin/Release/net10.0/ChummerMac.exe').Path
          # Use the STA apphost and its Windows manifest, not the dotnet DLL host.
          $process = Start-Process -FilePath $exe -ArgumentList @('--export-pdf', "`"$character`"", "`"$pdf`"") -PassThru
          if (-not $process.WaitForExit(90000)) {
            taskkill /PID $process.Id /T /F
            throw 'Native character preview timed out.'
          }
          $diagnostics = Join-Path $env:APPDATA 'ChummerGenSR4Mac/logs'
          if (Test-Path $diagnostics) { Copy-Item $diagnostics 'artifacts/checks/native-logs' -Recurse -Force }
          if ($process.ExitCode -ne 0) { throw "Native preview failed: $($process.ExitCode)" }
          if (-not (Test-Path $pdf)) { throw 'Native preview produced no PDF.' }
          $bytes = [IO.File]::ReadAllBytes($pdf)
          $content = [Text.Encoding]::Latin1.GetString($bytes)
          if ($bytes.Length -lt 1000 -or -not $content.StartsWith('%PDF-') -or $content -notmatch '/Type\s*/Page\b') {
            throw 'Native preview produced an invalid or empty PDF.'
          }
      # Window-only images contain fixed synthetic text or an empty workspace.
      # The detail text is assigned in
      # NativeCharacterDetailsChecks, not source-character fields or diagnostics.
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: synthetic-details-visual-${{ matrix.os }}
          path: |
            artifacts/checks/native-character-details-creation-2x.png
            artifacts/checks/native-character-details-career-2x.png
            artifacts/checks/native-empty-workspace-light-900.png
            artifacts/checks/native-empty-workspace-light-1200.png
            artifacts/checks/native-empty-workspace-dark-900.png
            artifacts/checks/native-empty-workspace-dark-1200.png
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: artifacts/checks
  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml
  package:
    needs: [validate, dependency-audit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install MSI tools
        run: brew install msitools
      - name: Package and verify both desktop downloads
        run: bash scripts/package-nightly.sh artifacts/nightly
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-assets
          path: artifacts/nightly/assets
          if-no-files-found: error
  publish:
    concurrency:
      group: chummer-release-assets
      cancel-in-progress: false
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nightly-assets
          path: assets
      - name: Publish Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-nightly.sh assets
