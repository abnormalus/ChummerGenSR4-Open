name: Nightly desktop builds
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "40 10 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    outputs:
      platforms: ${{ steps.history.outputs.platforms }}
      run_desktop: ${{ steps.history.outputs.run_desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: history
        name: Check desktop inputs and previous passing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tests/test_plan_desktop_validation.py
          python3 scripts/plan-desktop-validation.py
  checks:
    needs: plan
    if: needs.plan.outputs.run_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release archival safeguards
        run: python scripts/tests/test_archive_nightly.py
      - name: Verify reviewed PDF.js bundle
        run: python scripts/check-pdfjs.py
      - name: Test PDF.js safeguards
        run: python scripts/tests/test_pdfjs.py
      - name: Check modernization safeguards
        run: python scripts/check-modernization.py
      - name: Test modernization safeguards
        run: python scripts/tests/test_modernization.py
      - name: Test bounded verification runner
        run: python scripts/tests/test_run_bounded.py
      - name: Verify build identity safeguards
        run: python scripts/tests/test_build_identity.py
  dependency-audit:
    needs: plan
    if: needs.plan.outputs.run_desktop == 'true'
    uses: ./.github/workflows/dependency-audit.yml
  package-macos:
    needs: [plan, checks, dependency-audit]
    if: github.event_name != 'pull_request' || contains(fromJSON(needs.plan.outputs.platforms), 'macos-latest')
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Package and verify macos download
        run: bash scripts/package-nightly.sh artifacts/nightly macos
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-assets-macos
          path: artifacts/nightly/assets
          if-no-files-found: error
  acceptance-macos:
    name: package-acceptance (macos-latest)
    needs: package-macos
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nightly-assets-macos
          path: artifacts/candidate
      - name: Verify installed candidate and package lifecycle
        shell: pwsh
        run: ./scripts/test-installed-package.ps1 -Assets artifacts/candidate -ExpectedSource '${{ github.sha }}' -Output artifacts/package-acceptance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-acceptance-macos-latest
          path: artifacts/package-acceptance
          if-no-files-found: error
          retention-days: 14
  package-windows:
    needs: [plan, checks, dependency-audit]
    if: github.event_name != 'pull_request' || contains(fromJSON(needs.plan.outputs.platforms), 'windows-latest')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install MSI tools
        run: sudo apt-get update && sudo apt-get install -y msitools wixl
      - name: Package and verify windows download
        run: bash scripts/package-nightly.sh artifacts/nightly windows
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-assets-windows
          path: artifacts/nightly/assets
          if-no-files-found: error
  acceptance-windows:
    name: package-acceptance (windows-latest)
    needs: package-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: nightly-assets-windows
          path: artifacts/candidate
      - name: Ensure native Windows browser runtime
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1
      - name: Verify installed candidate and package lifecycle
        shell: pwsh
        run: ./scripts/test-installed-package.ps1 -Assets artifacts/candidate -ExpectedSource '${{ github.sha }}' -Output artifacts/package-acceptance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-acceptance-windows-latest
          path: artifacts/package-acceptance
          if-no-files-found: error
          retention-days: 14
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    concurrency:
      group: chummer-release-assets
      cancel-in-progress: false
    needs: [acceptance-macos, acceptance-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-assets-*
          path: candidates
      - name: Assemble verified release assets
        run: |
          set -euo pipefail
          mac=candidates/nightly-assets-macos
          windows=candidates/nightly-assets-windows
          (cd "$mac" && sha256sum --check SHA256SUMS.txt)
          (cd "$windows" && sha256sum --check SHA256SUMS.txt)
          cmp "$mac/BUILD.txt" "$windows/BUILD.txt"
          mkdir assets
          cp "$mac/BUILD.txt" "$mac/ChummerSR4-macOS-arm64.zip" "$windows/ChummerSR4-Windows-x64.msi" assets/
          (cd assets && sha256sum BUILD.txt ChummerSR4-macOS-arm64.zip ChummerSR4-Windows-x64.msi > SHA256SUMS.txt)
      - name: Publish Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/publish-nightly.sh assets
