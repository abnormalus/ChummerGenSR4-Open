<!doctype html><html lang="en"><meta charset="utf-8"><title>Dossier tests</title><h1>Dossier verification</h1><pre id="results">Running…</pre><script type="module">

const lines=[];function assert(test,message){if(!test)throw Error(message);}async function test(name,fn){try{await fn();lines.push('PASS '+name);}catch(e){lines.push('FAIL '+name+': '+e.message);}document.querySelector('pre').textContent=lines.join('\n');}
await test('Unedited XML is byte-identical',()=>{assert(base64(new Character(demo).bytes())===base64(demo),'bytes changed');});
await test('Unknown XML and notes survive edits',()=>{const xml=new TextDecoder().decode(demo).replace('</character>','<future data="yes"><![CDATA[a < b]]></future></character>');const c=new Character(new TextEncoder().encode(xml));c.set('alias','Changed');c.setField('test','yes');const copy=new Character(c.bytes(true));assert(copy.root.querySelector('future').textContent==='a < b','unknown lost');assert(copy.field('test')==='yes','metadata lost');assert(copy.plainNotes==='Keep an escape route open.','notes lost');});
await test('Essence and melee damage',()=>{const c=new Character(demo);assert(c.essence==='6','essence');assert(c.weaponDamage(c.rows('weapons','weapon')[1])==='2S','STR formula: '+c.weaponDamage(c.rows('weapons','weapon')[1]));});
await test('Wounds update skill pools',()=>{const c=new Character(demo);c.set('physicalcmfilled','3');assert(c.skills[0].pool===8,'pool not reduced');});
await test('Reject invalid export and entity input',()=>{const c=new Character(demo);c.set('karma','-');let rejected=false;try{c.bytes(true);}catch{rejected=true;}assert(rejected,'draft accepted');rejected=false;try{new Character(new TextEncoder().encode('<!DOCTYPE character><character><attributes/></character>'));}catch{rejected=true;}assert(rejected,'doctype accepted');});
const info={id:7,private:true,permissions:{push:true},default_branch:'main'};
const base={id:'test',bytes:demo,remote:{repoId:7,path:'characters/test.chum',sha:'old',hash:await fingerprint(demo)}};
function github(remote,repository=info){let puts=0;const client=new GitHub('sample/private','test-only',async(url,options)=>{if(options.method==='PUT'){puts++;return Response.json({content:{sha:'saved'}});}if(url.endsWith('/sample/private'))return Response.json(repository);if(!remote)return Response.json({}, {status:404});return Response.json({sha:remote.sha,size:remote.bytes.length,encoding:'base64',content:base64(remote.bytes)});});return {client,puts:()=>puts};}
await test('Browser fetch keeps its native receiver',async()=>{const original=globalThis.fetch;try{globalThis.fetch=function(){assert(this===globalThis,'fetch received GitHub instance');return Promise.resolve(Response.json(info));};await new GitHub('sample/private','test-only').verify();}finally{globalThis.fetch=original;}});
await test('Public repository refused',async()=>{const {client,puts}=github(null,{...info,private:false});let refused=false;try{await client.sync({id:'new'},demo);}catch{refused=true;}assert(refused&&puts()===0,'public upload');});
await test('Create first snapshot',async()=>{const {client,puts}=github(null);const r=await client.sync({id:'new'},demo);assert(r.remote.sha==='saved'&&puts()===1,'create failed');});
const edited=new Character(demo);edited.set('alias','Edited');const editedBytes=edited.bytes();
await test('Conditional update',async()=>{const {client,puts}=github({sha:'old',bytes:demo});await client.sync(base,editedBytes);assert(puts()===1,'no update');});
await test('Safe remote pull',async()=>{const {client,puts}=github({sha:'new',bytes:editedBytes});const r=await client.sync(base,demo);assert(r.pull&&puts()===0,'pull failed');});
await test('Two-sided conflict never writes',async()=>{const c=new Character(demo);c.set('alias','Other');const {client,puts}=github({sha:'new',bytes:c.bytes()});let conflict=false;try{await client.sync(base,editedBytes);}catch(e){conflict=e.conflict;}assert(conflict&&puts()===0,'overwrote conflict');});
await test('Recognize uncertain successful upload',async()=>{const {client,puts}=github({sha:'new',bytes:editedBytes});const r=await client.sync(base,editedBytes);assert(r.remote.sha==='new'&&puts()===0,'duplicate upload');});
await test('Remote deletion never recreates automatically',async()=>{const {client,puts}=github(null);let rejected=false;try{await client.sync(base,demo);}catch{rejected=true;}assert(rejected&&puts()===0,'recreated file');});
await test('Acknowledgement preserves newer local bytes',async()=>{const id='test-'+crypto.randomUUID();await db.save({id,title:'Initial',bytes:demo});await db.save({id,title:'New edit',bytes:editedBytes});const latest=await db.acknowledge(id,{sha:'snapshot'});assert(latest.title==='New edit'&&base64(latest.bytes)===base64(editedBytes),'new edit lost');});
if(location.search.includes('fixtures')) for(let i=0;i<4;i++) await test('Private fixture '+(i+1)+' import and round trip',async()=>{const bytes=new Uint8Array(await (await fetch('./fixtures/'+i+'.chum')).arrayBuffer());const c=new Character(bytes);assert(base64(c.bytes())===base64(bytes),'original changed');const count=c.document.getElementsByTagName('*').length;c.set('alias',c.title+' test');const copy=new Character(c.bytes(true));assert(copy.document.getElementsByTagName('*').length===count,'XML structure lost');assert(copy.essence===c.essence,'essence lost');});
await test('Repository listing includes root and nested characters',async()=>{const client=new GitHub('sample/private','test-only',async url=>Response.json(url.endsWith('/sample/private')?info:{tree:[{path:'Root.chum',type:'blob',mode:'100644',sha:'a'},{path:'Archive/Nested.CHUM',type:'blob',mode:'100644',sha:'b'},{path:'Link.chum',type:'blob',mode:'120000',sha:'c'},{path:'notes.txt',type:'blob',sha:'d'}]}));const files=await client.list();assert(files.length===2&&files.some(f=>f.path==='Archive/Nested.CHUM'),'missing characters or symlink included');});
await test('Truncated repository trees are traversed completely',async()=>{const client=new GitHub('sample/private','test-only',async url=>Response.json(url.endsWith('/sample/private')?info:url.includes('?recursive')?{sha:'root',truncated:true,tree:[]}:url.endsWith('/root')?{tree:[{path:'Folder',type:'tree',sha:'folder'}]}:{tree:[{path:'Deep.chum',type:'blob',mode:'100644',sha:'file'}]}));assert((await client.list())[0].path==='Folder/Deep.chum','truncated listing');});
await test('Portraits accept embedded raster data and reject remote or SVG content',()=>{const c=new Character(demo);c.set('mugshot','https://example.com/portrait.png');assert(portraitBytes(c)===null,'remote image accepted');c.set('mugshot',base64(new TextEncoder().encode('<svg/>')));assert(portraitBytes(c)===null,'SVG accepted');c.set('mugshot','iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a0RkAAAAASUVORK5CYII=');assert(portraitBytes(c)?.type==='image/png','PNG missing');});
await test('Character search matches aliases and repository paths',()=>{assert(matchesCharacter({name:'id.chum',path:'Archive/id.chum',preview:{title:'Nightjar',name:'Morgan'}},'nightjar'),'alias search');assert(matchesCharacter({path:'Archive/id.chum'},'archive'),'folder search');});
await test('Reopening a linked character selects its edited local copy',async()=>{const record={id:'local',filename:'runner.chum',bytes:editedBytes,remote:{repoId:7,path:'characters/runner.chum'}};assert(await existingCharacter([record],{bytes:demo,remote:{repoId:7,path:'characters/runner.chum'}})===record,'linked copy duplicated');});
await test('Reimporting original bytes retains the modified working copy',async()=>{const record={id:'local',filename:'runner.chum',bytes:editedBytes,sourceHash:await fingerprint(demo)};assert(await existingCharacter([record],{bytes:demo,filename:'renamed.chum'})===record,'original import duplicated');});

await test('Install prompt is used once and falls back to platform instructions',async()=>{const win=new EventTarget();win.matchMedia=()=>({matches:false});const nav={userAgent:'iPhone',platform:'iPhone',maxTouchPoints:1};const installer=installController(win,nav);assert((await installer.request()).steps.some(s=>s.includes('Add to Home Screen')),'missing iOS steps');let count=0;const event=new Event('beforeinstallprompt',{cancelable:true});event.prompt=async()=>{count++;};event.userChoice=Promise.resolve({outcome:'accepted'});win.dispatchEvent(event);assert(event.defaultPrevented,'native event not deferred');assert((await installer.request()).kind==='accepted'&&count===1,'prompt not called once');assert((await installer.request()).kind==='guide','reused prompt');win.dispatchEvent(new Event('appinstalled'));assert(installer.installed()&&(await installer.request()).kind==='installed','installed state wrong');assert(installGuide({userAgent:'Mac',platform:'MacIntel',maxTouchPoints:5})[0].includes('Safari'),'iPad desktop UA not recognized');});
await test('Distinct known file hashes do not merge by filename and name alone',async()=>{const copy=new Character(demo);copy.set('karma','99');assert(await existingCharacter([{id:'local',filename:'runner.chum',bytes:demo,sourceHash:await fingerprint(demo)}],{bytes:copy.bytes(),filename:'runner.chum'})===null,'different known file conflated');});
await test('Autosync waits offline and uploads only changed characters when online',async()=>{let online=false,writes=0,rows=[{id:'dirty',bytes:editedBytes,remote:{repoId:7,hash:await fingerprint(demo)}},{id:'clean',bytes:demo,remote:{repoId:7,hash:await fingerprint(demo)}}],message='';const client={id:7,sync:async(r,b)=>{writes++;return {remote:{repoId:7,sha:'saved',hash:await fingerprint(b)}};}};const service=new AutoSync({client:()=>client,online:()=>online,flush:async()=>{},list:async()=>rows,validate:b=>b,acknowledge:async(id,remote)=>{rows=rows.map(r=>r.id===id?{...r,remote}:r);return rows.find(r=>r.id===id);},onAck:()=>{},onConflict:()=>{throw Error('unexpected conflict');},report:m=>{message=m;}});await service.tick();assert(writes===0&&message.includes('Offline'),'offline write');online=true;await service.tick();assert(writes===1&&message.includes('up to date'),'dirty upload failed');await service.tick();assert(writes===1,'uploaded unchanged data');});
await test('Autosync flags conflicting edits without discarding them',async()=>{let flagged=false,acked=false;const row={id:'conflict',bytes:editedBytes,remote:{repoId:7,hash:await fingerprint(demo)}};const client={id:7,sync:async()=>{const e=Error('Both changed');e.conflict=true;throw e;}};const service=new AutoSync({client:()=>client,online:()=>true,flush:async()=>{},list:async()=>[row],validate:b=>b,acknowledge:async()=>{acked=true;},onAck:()=>{},onConflict:()=>{flagged=true;},report:()=>{}});await service.tick();assert(flagged&&!acked&&base64(row.bytes)===base64(editedBytes),'conflict lost local bytes');});
await test('Overwrite refuses an unreviewed or newer GitHub revision',async()=>{const {client,puts}=github({sha:'new',bytes:demo});assert(typeof client.overwrite==='function','missing overwrite method');let refused=false;try{await client.overwrite('characters/test.chum',editedBytes,'old');}catch{refused=true;}assert(refused&&puts()===0,'overwrote unseen change');});
await test('Delete local copy removes only the local record',async()=>{const id='delete-test-'+crypto.randomUUID();await db.save({id,bytes:demo,title:'Delete test'});await db.remove(id);assert(!(await db.all()).some(r=>r.id===id),'local copy retained');});
await test('Skill categories default to positive active skills and include knowledge languages',()=>{const c=new Character(demo);const n=c.document.createElement('skill');for(const [k,v] of Object.entries({name:'Japanese',knowledge:'True',skillcategory:'Language',attribute:'INT',rating:'0',totalvalue:'0'})){const e=c.document.createElement(k);e.textContent=v;n.append(e);}c.root.querySelector('skills').append(n);assert(filteredSkills(c).every(s=>s.pool>0&&!['Japanese','Astral Combat'].includes(s.name)),'default filter');assert(filteredSkills(c,'Combat').map(s=>s.name).join()==='Pistols','combat category');assert(filteredSkills(c,'Knowledge',false).some(s=>s.name==='Japanese'),'native language omitted');assert(filteredSkills(c,'Knowledge',true).some(s=>s.name==='Japanese'&&skillRating(s)==='N'),'native language hidden or not N');assert(skillRating(c.skills.find(s=>s.name==='Astral Combat'))===0,'ordinary zero rating changed');assert(!magicSkillsApply(c),'mundane magic button');c.set('magician','True');assert(magicSkillsApply(c)&&filteredSkills(c,'Magic',false).some(s=>s.name==='Astral Combat'),'magical skills missing');assert(filteredSkills(c,'Active',false).some(s=>s.name==='Astral Combat'),'active excludes magical active');});
await test('Weapon pools include installed modifiers, ammo, smartlink and matching specialization',()=>{
 const xml=new TextDecoder().decode(demo).replace('<name>Pistols</name>','<name>Pistols</name><spec>Heavy Pistols</spec>').replace('<ammoremaining>15</ammoremaining>','<ammoremaining>15</ammoremaining><ammoloaded>ammo-test</ammoloaded><accessories><accessory><name>Smartgun System, Internal</name><installed>True</installed></accessory><accessory><name>Ignored</name><installed>False</installed><dicepool>10</dicepool></accessory></accessories><weaponmods><weaponmod><name>Personalized Grip</name><installed>True</installed><dicepool>Rating</dicepool><rating>1</rating><rangebonus>50</rangebonus></weaponmod></weaponmods>').replace('</gears>','<gear><guid>ammo-test</guid><name>Test rounds</name><weaponbonus><pool>1</pool><range>50</range></weaponbonus></gear></gears>').replace('</character>','<improvements><improvement><improvementttype>Smartlink</improvementttype><enabled>True</enabled><val>1</val></improvement></improvements></character>');
 const c=new Character(new TextEncoder().encode(xml)),w=c.rows('weapons','weapon')[0];assert(weaponPool(c,w).text==='13 (15)','weapon pool bonuses');assert(loadedAmmo(c,w)?.querySelector('name')?.textContent==='Test rounds','loaded ammo link');assert(weaponRanges(c,w).map(b=>b.text).join()==='0–10 m,11–40 m,41–80 m,81–120 m','all modified range bands');c.set('physicalcmfilled',3);assert(weaponPool(c,w).text==='12 (14)','wounds not applied once');assert(base64(c.bytes(true)).length>0,'export failed');
});
await test('Range formulas and unavailable skills remain explicit',()=>{const c=new Character(demo),w=c.rows('weapons','weapon')[0];c.setNode(w,'category','Throwing Weapons');c.setNode(w,'range','Grenades');assert(weaponRanges(c,w).map(b=>b.text).join()==='0–6 m,7–12 m,13–18 m,19–30 m','strength range bands');assert(weaponPool(c,w).text==='—','invented missing skill pool');assert(conditionPenalty(c,true,3)===-1&&conditionPenalty(c,true,6)===-2&&conditionPenalty(c,true,9)===-3&&conditionPenalty(c,true,2)===0,'condition threshold labels');});
await test('Reload and firing conserve ammo, reject invalid exchanges and survive export',()=>{const xml=new TextDecoder().decode(demo).replace('<ammoremaining>15</ammoremaining>','<ammoremaining>0</ammoremaining><requireammo>True</requireammo>').replace('</gears>','<gear><guid>ammo-a</guid><name>Regular</name><category>Ammunition</category><extra>Heavy Pistols</extra><qty>30</qty></gear><gear><guid>ammo-b</guid><name>APDS</name><category>Ammunition</category><extra>Heavy Pistols</extra><qty>10</qty></gear><gear><name>Grenade: Flash-Bang</name><category>Grenades</category><qty>2</qty></gear></gears>');const c=new Character(new TextEncoder().encode(xml)),w=c.rows('weapons','weapon')[0],[a,b]=ammunition(c,w);reloadWeapon(c,w,1,a,15);assert(a.querySelector('qty').textContent==='15'&&loadedAmmo(c,w)===a,'load failed');fireWeapon(c,w,1,2);assert(a.querySelector('qty').textContent==='15'&&w.querySelector('ammoremaining').textContent==='13','double spent reserves');const before=base64(c.bytes());try{reloadWeapon(c,w,1,b,11);throw Error('accepted shortage');}catch(e){assert(e.message!=='accepted shortage'&&base64(c.bytes())===before,'partial mutation');}reloadWeapon(c,w,1,b,10);assert(a.querySelector('qty').textContent==='28'&&b.querySelector('qty').textContent==='0','swap lost rounds');reloadWeapon(c,w,1,null,0);assert(b.querySelector('qty').textContent==='10','unload lost rounds');assert(fireCounts(w).join()==='1,2','SA fire counts');const grenade=c.gear.find(r=>r.node.querySelector('name')?.textContent==='Grenade: Flash-Bang').node;useGrenade(c,grenade);assert(grenade.querySelector('qty').textContent==='1','grenade not spent');const restored=new Character(c.bytes(true));assert(ammunition(restored,restored.rows('weapons','weapon')[0])[0].querySelector('qty').textContent==='28','ammo edits not persisted');});
await test('Perception shows only differing sensory pools and retains bonuses after editing',()=>{const xml=new TextDecoder().decode(demo).replace('</skills>',[['Visual',10],['Touch',8],['Audio',7]].map(([name,pool])=>`<skill><name>Perception (${name})</name><attribute>INT</attribute><rating>3</rating><totalvalue>${pool}</totalvalue><skillcategory>Physical Active</skillcategory></skill>`).join('')+'</skills>');const c=new Character(new TextEncoder().encode(xml)),base=c.skills.find(s=>s.name==='Perception');assert(perceptionDifferences(c,base).map(s=>s.name+' '+s.pool).join()==='Visual 10,Touch 8','equal sensory rows not hidden');c.setSkillRating(base.index,4);assert(perceptionDifferences(c,c.skills[base.index]).map(s=>s.pool).join()==='11,9','sensory bonuses changed on rating edit');});
await test('Armor stacking penalizes linked tests once and wearing changes persist',()=>{const xml=new TextDecoder().decode(demo).replace('</character>','<armors><armor><name>Jacket</name><b>8</b><i>6</i><equipped>True</equipped></armor><armor><name>Helmet</name><b>+1</b><i>+2</i><equipped>True</equipped><armormods><armormod><name>Chemical Protection</name><rating>3</rating><equipped>True</equipped></armormod></armormods></armor></armors></character>').replace('</skills>','<skill><name>Dodge</name><attribute>AGI</attribute><rating>3</rating><totalvalue>8</totalvalue></skill></skills>');const c=new Character(new TextEncoder().encode(xml));assert(c.armor.b===9&&c.armor.i===8&&c.armor.penalty===-1,'stacked armor/penalty');assert(c.total('AGI')===4&&c.total('REA')===3&&c.skills.find(s=>s.name==='Pistols').pool===8,'penalty missing or doubled');assert(defensePools(c).find(r=>r.name==='Full ranged dodge').pool===6,'defence includes Agility twice');assert(armorProtections(c)[0].name==='Chemical Protection','situational armor protection missing');c.set('physicalcmfilled',3);assert(defensePools(c).find(r=>r.name==='Full ranged dodge').pool===5,'wounds doubled in defence');c.setNode(c.rows('armors','armor')[1],'equipped','False');assert(c.total('AGI')===5&&c.skills.find(s=>s.name==='Pistols').pool===8&&armorProtections(c).length===0,'removing armor did not restore tests');assert(new Character(c.bytes(true)).armor.b===8,'worn flag not persisted');});
await test('Heaviest fallback, explicit no armor and imported encumbrance are handled',()=>{const xml=new TextDecoder().decode(demo).replace('</character>','<armors><armor><name>Light</name><b>4</b><i>2</i><equipped>False</equipped></armor><armor><name>Heavy</name><b>12</b><i>10</i><equipped>False</equipped></armor></armors></character>');const c=new Character(new TextEncoder().encode(xml));assert(c.armor.b===12&&c.armor.penalty===-2,'heaviest default');c.setField('armorSelectionExplicit','True');assert(c.armor.b===0&&c.armor.penalty===0,'explicit no armor ignored');const imported=xml.replace('<b>12</b>','<b>10</b>').replace('<equipped>False</equipped></armor></armors>','<equipped>True</equipped></armor></armors>').replace('</character>','<improvements>'+['AGI','REA'].map(id=>`<improvement><improvementttype>Attribute</improvementttype><improvementsource>ArmorEncumbrance</improvementsource><improvedname>${id}</improvedname><aug>-1</aug><enabled>True</enabled></improvement>`).join('')+'</improvements></character>').replace('<totalvalue>5</totalvalue>','<totalvalue>4</totalvalue>').replace('<totalvalue>9</totalvalue>','<totalvalue>8</totalvalue>');const d=new Character(new TextEncoder().encode(imported));assert(d.total('AGI')===4&&d.skills.find(s=>s.name==='Pistols').pool===8,'imported armor penalty doubled');});
await test('Willow-style ESS snapshot uses total Essence and augmentation costs/conditions resolve',()=>{const xml=new TextDecoder().decode(demo).replace('</attributes>','<attribute><name>ESS</name><value>1</value><totalvalue>1</totalvalue><metatypemax>6</metatypemax></attribute></attributes>').replace('</character>','<cyberwares><cyberware><guid>ware-test</guid><name>Muscle Toner</name><ess>Rating * 0.2</ess><rating>2</rating><grade>Alphaware</grade><improvementsource>Bioware</improvementsource></cyberware></cyberwares><improvements><improvement><sourcename>ware-test</sourcename><improvementttype>Skill</improvementttype><improvedname>Perception (Visual)</improvedname><val>3</val><enabled>True</enabled></improvement></improvements></character>');const c=new Character(new TextEncoder().encode(xml)),w=c.rows('cyberwares','cyberware')[0];assert(c.essence==='6'&&c.total('ESS')===6,'raw ESS snapshot leaked');assert(augmentationEssence(c,w)==='0.32','rated/graded Essence cost');assert(augmentationEffects(c,w).some(r=>r.name.includes('Visual')&&r.amount==='+3'),'situational bonus lost');});
