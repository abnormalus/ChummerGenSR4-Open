<!doctype html><html lang="en"><meta charset="utf-8"><title>Dossier tests</title><h1>Dossier verification</h1><pre id="results">Running…</pre><script type="module">
import {Character,demo,base64,fingerprint} from '../dist/core.mjs?v=2';
import {GitHub} from '../dist/github.mjs';
import {portraitBytes,matchesCharacter} from '../dist/repository-browser.mjs';
import * as db from '../dist/storage.mjs?test=1';
const lines=[];function assert(test,message){if(!test)throw Error(message);}async function test(name,fn){try{await fn();lines.push('PASS '+name);}catch(e){lines.push('FAIL '+name+': '+e.message);}document.querySelector('pre').textContent=lines.join('\n');}
await test('Unedited XML is byte-identical',()=>{assert(base64(new Character(demo).bytes())===base64(demo),'bytes changed');});
await test('Unknown XML and notes survive edits',()=>{const xml=new TextDecoder().decode(demo).replace('</character>','<future data="yes"><![CDATA[a < b]]></future></character>');const c=new Character(new TextEncoder().encode(xml));c.set('alias','Changed');c.setField('test','yes');const copy=new Character(c.bytes(true));assert(copy.root.querySelector('future').textContent==='a < b','unknown lost');assert(copy.field('test')==='yes','metadata lost');assert(copy.plainNotes==='Keep an escape route open.','notes lost');});
await test('Essence and melee damage',()=>{const c=new Character(demo);assert(c.essence==='6','essence');assert(c.weaponDamage(c.rows('weapons','weapon')[1])==='2S','STR formula: '+c.weaponDamage(c.rows('weapons','weapon')[1]));});
await test('Wounds update skill pools',()=>{const c=new Character(demo);c.set('physicalcmfilled','3');assert(c.skills[0].pool===8,'pool not reduced');});
await test('Reject invalid export and entity input',()=>{const c=new Character(demo);c.set('karma','-');let rejected=false;try{c.bytes(true);}catch{rejected=true;}assert(rejected,'draft accepted');rejected=false;try{new Character(new TextEncoder().encode('<!DOCTYPE character><character><attributes/></character>'));}catch{rejected=true;}assert(rejected,'doctype accepted');});
const info={id:7,private:true,permissions:{push:true},default_branch:'main'};
const base={id:'test',bytes:demo,remote:{repoId:7,path:'characters/test.chum',sha:'old',hash:await fingerprint(demo)}};
function github(remote,repository=info){let puts=0;const client=new GitHub('sample/private','test-only',async(url,options)=>{if(options.method==='PUT'){puts++;return Response.json({content:{sha:'saved'}});}if(url.endsWith('/sample/private'))return Response.json(repository);if(!remote)return Response.json({}, {status:404});return Response.json({sha:remote.sha,size:remote.bytes.length,encoding:'base64',content:base64(remote.bytes)});});return {client,puts:()=>puts};}
await test('Browser fetch keeps its native receiver',async()=>{const original=globalThis.fetch;try{globalThis.fetch=function(){assert(this===globalThis,'fetch received GitHub instance');return Promise.resolve(Response.json(info));};await new GitHub('sample/private','test-only').verify();}finally{globalThis.fetch=original;}});
await test('Public repository refused',async()=>{const {client,puts}=github(null,{...info,private:false});let refused=false;try{await client.sync({id:'new'},demo);}catch{refused=true;}assert(refused&&puts()===0,'public upload');});
await test('Create first snapshot',async()=>{const {client,puts}=github(null);const r=await client.sync({id:'new'},demo);assert(r.remote.sha==='saved'&&puts()===1,'create failed');});
const edited=new Character(demo);edited.set('alias','Edited');const editedBytes=edited.bytes();
await test('Conditional update',async()=>{const {client,puts}=github({sha:'old',bytes:demo});await client.sync(base,editedBytes);assert(puts()===1,'no update');});
await test('Safe remote pull',async()=>{const {client,puts}=github({sha:'new',bytes:editedBytes});const r=await client.sync(base,demo);assert(r.pull&&puts()===0,'pull failed');});
await test('Two-sided conflict never writes',async()=>{const c=new Character(demo);c.set('alias','Other');const {client,puts}=github({sha:'new',bytes:c.bytes()});let conflict=false;try{await client.sync(base,editedBytes);}catch(e){conflict=e.conflict;}assert(conflict&&puts()===0,'overwrote conflict');});
await test('Recognize uncertain successful upload',async()=>{const {client,puts}=github({sha:'new',bytes:editedBytes});const r=await client.sync(base,editedBytes);assert(r.remote.sha==='new'&&puts()===0,'duplicate upload');});
await test('Remote deletion never recreates automatically',async()=>{const {client,puts}=github(null);let rejected=false;try{await client.sync(base,demo);}catch{rejected=true;}assert(rejected&&puts()===0,'recreated file');});
await test('Acknowledgement preserves newer local bytes',async()=>{const id='test-'+crypto.randomUUID();await db.save({id,title:'Initial',bytes:demo});await db.save({id,title:'New edit',bytes:editedBytes});const latest=await db.acknowledge(id,{sha:'snapshot'});assert(latest.title==='New edit'&&base64(latest.bytes)===base64(editedBytes),'new edit lost');});
if(location.search.includes('fixtures')) for(let i=0;i<4;i++) await test('Private fixture '+(i+1)+' import and round trip',async()=>{const bytes=new Uint8Array(await (await fetch('./fixtures/'+i+'.chum')).arrayBuffer());const c=new Character(bytes);assert(base64(c.bytes())===base64(bytes),'original changed');const count=c.document.getElementsByTagName('*').length;c.set('alias',c.title+' test');const copy=new Character(c.bytes(true));assert(copy.document.getElementsByTagName('*').length===count,'XML structure lost');assert(copy.essence===c.essence,'essence lost');});
await test('Repository listing includes root and nested characters',async()=>{const client=new GitHub('sample/private','test-only',async url=>Response.json(url.endsWith('/sample/private')?info:{tree:[{path:'Root.chum',type:'blob',mode:'100644',sha:'a'},{path:'Archive/Nested.CHUM',type:'blob',mode:'100644',sha:'b'},{path:'Link.chum',type:'blob',mode:'120000',sha:'c'},{path:'notes.txt',type:'blob',sha:'d'}]}));const files=await client.list();assert(files.length===2&&files.some(f=>f.path==='Archive/Nested.CHUM'),'missing characters or symlink included');});
await test('Truncated repository trees are traversed completely',async()=>{const client=new GitHub('sample/private','test-only',async url=>Response.json(url.endsWith('/sample/private')?info:url.includes('?recursive')?{sha:'root',truncated:true,tree:[]}:url.endsWith('/root')?{tree:[{path:'Folder',type:'tree',sha:'folder'}]}:{tree:[{path:'Deep.chum',type:'blob',mode:'100644',sha:'file'}]}));assert((await client.list())[0].path==='Folder/Deep.chum','truncated listing');});
await test('Portraits accept embedded raster data and reject remote or SVG content',()=>{const c=new Character(demo);c.set('mugshot','https://example.com/portrait.png');assert(portraitBytes(c)===null,'remote image accepted');c.set('mugshot',base64(new TextEncoder().encode('<svg/>')));assert(portraitBytes(c)===null,'SVG accepted');c.set('mugshot','iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a0RkAAAAASUVORK5CYII=');assert(portraitBytes(c)?.type==='image/png','PNG missing');});
await test('Character search matches aliases and repository paths',()=>{assert(matchesCharacter({name:'id.chum',path:'Archive/id.chum',preview:{title:'Nightjar',name:'Morgan'}},'nightjar'),'alias search');assert(matchesCharacter({path:'Archive/id.chum'},'archive'),'folder search');});
lines.push(lines.some(line=>line.startsWith('FAIL'))?'FAILED':'ALL TESTS PASSED');document.querySelector('pre').textContent=lines.join('\n');
</script></html>
