<!doctype html><html lang="en"><meta charset="utf-8"><title>Printing verification</title><h1>Printing verification</h1><pre id="results">Generating…</pre><div id="downloads"></div><script type="module">
import {Character,demo,setValue,base64} from '../dist/core.mjs';import {characterPDF} from '../dist/printing.mjs';import {primaryArmor} from '../dist/print-data.mjs';import {PDFDocument} from '../dist/vendor/pdf-lib.mjs';
const results=[],output=document.querySelector('pre');
function link(name,bytes){const a=document.createElement('a');a.textContent=name;a.download=name+'.pdf';a.dataset.pdf=base64(bytes);a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.style='display:block;margin:12px';document.querySelector('#downloads').append(a);}
async function check(name,fn){try{await fn();results.push('PASS '+name);}catch(e){results.push('FAIL '+name+': '+e.message);console.error(e);}output.textContent=results.join('\n');}
const c=new Character(demo);c.set('alias','Nightjar – Zoë');c.set('physicalcmfilled','3');
const melee=c.rows('weapons','weapon')[1].cloneNode(true);setValue(melee,'name','Long test melee weapon');setValue(melee,'damage','(STR/2+4)P');c.root.querySelector('weapons').append(melee);
const vehicle=c.document.createElement('vehicles'),n=c.document.createElement('vehicle');for(const [k,v] of [['name','Mitsuhama Arachne Long Vehicle Name'],['body','4'],['handling','2'],['speed','25'],['pilot','3']])setValue(n,k,v);vehicle.append(n);c.root.append(vehicle);c.touch();
await check('Primary armor selects best worn pair and falls back to owned',()=>{const armors=c.document.createElement('armors');for(const [name,b,i,equipped] of [['Helmet',1,2,'True'],['Jacket',8,6,'True'],['Unworn heavy armor',12,10,'False']]){const a=c.document.createElement('armor');for(const [key,v] of Object.entries({name,b,i,equipped}))setValue(a,key,v);armors.append(a);}c.root.append(armors);c.touch();if(primaryArmor(c).querySelector('name').textContent!=='Jacket')throw Error('Wrong equipped armor');for(const a of armors.children)setValue(a,'equipped','False');if(primaryArmor(c).querySelector('name').textContent!=='Unworn heavy armor')throw Error('Wrong fallback armor');for(const a of armors.children)setValue(a,'equipped',a.querySelector('name').textContent==='Unworn heavy armor'?'False':'True');});
await check('Full PDF includes multiple readable sections',async()=>{const bytes=await characterPDF(c);const doc=await PDFDocument.load(bytes);if(doc.getPageCount()<2)throw Error('Expected multiple pages');link('Full character',bytes);});
await check('Official form has two template pages plus continuation',async()=>{const bytes=await characterPDF(c,{official:true});const doc=await PDFDocument.load(bytes);if(doc.getPageCount()<3)throw Error('Missing continuation');for(const p of doc.getPages())if(p.getWidth()!==612||p.getHeight()!==792)throw Error('Wrong page geometry');link('Official character sheet',bytes);});
await check('Long paragraphs paginate without dropped content',async()=>{c.setPlainNotes('Long word: '+('abcdefghijklmnopqrstuvwx'.repeat(50))+'\n'+('Repeated notes with café and naïve. '.repeat(600)));const bytes=await characterPDF(c);const doc=await PDFDocument.load(bytes);if(doc.getPageCount()<6)throw Error('Missing overflow pages');link('Long notes stress test',bytes);});
if(location.search.includes('fixtures'))for(let i=0;i<4;i++)await check('Private fixture '+(i+1)+' full and official PDFs',async()=>{const bytes=new Uint8Array(await (await fetch('./fixtures/'+i+'.chum')).arrayBuffer());const c=new Character(bytes);link('Fixture '+(i+1)+' full',await characterPDF(c));link('Fixture '+(i+1)+' official',await characterPDF(c,{official:true}));});
results.push(results.some(r=>r.startsWith('FAIL'))?'FAILED':'ALL PRINT CHECKS PASSED');output.textContent=results.join('\n');
</script></html>
